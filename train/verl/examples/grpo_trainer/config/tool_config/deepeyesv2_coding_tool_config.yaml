tools:
  - class_name: "verl.tools.jupyter_tool.JupyterTool"
    config:
      type: "native"
      jupyter_url: "${oc.env:SANDBOX_URL}/run_jupyter"
      backend_urls:
        - "http://localhost:28901"
        - "http://localhost:28902"
        - "http://localhost:28903"
        - "http://localhost:28904"
      default_timeout: 200
      request_timeout: 240
      max_images_per_round: 10
      enable_image_init: true
    tool_schema:
      type: "function"
      function:
        name: "python_interpreter"
        description: "A tool for executing Python code with image processing capabilities."
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "The Python code to execute."
          required: ["code"]
